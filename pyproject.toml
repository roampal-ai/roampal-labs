[project]
name = "roampal-labs"
version = "0.1.0"
description = "Memory retrieval benchmark for roampal"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "sentence-transformers>=5.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "filelock>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
